<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F7F3F0;min-height:100vh;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
:root{--rouge:#C0392B;--rouge-dark:#922B21;--rouge-light:#FADBD8;--rouge-mid:#E74C3C;--noir:#1A1A1A;--noir-mid:#2C2C2C;--amber:#BA7517;--amber-light:#FAEEDA;--blue:#185FA5;--blue-light:#E6F1FB;--green:#2E7D32;--green-light:#E8F5E9}

.badge-todo{background:var(--amber-light);color:var(--amber)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:200}

</style>

<script>
// ============================================================
// CONFIGURATION
// ============================================================
// Supabase > Project Settings > API
const SUPABASE_URL = 'https://xpjsumcttpntlwawrujr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_eTNwmTB1KwCS5hqaT9klkw_RE6y2hx0';
const BUCKET = 'jardinator';
//
// La clé ci-dessus est publique par conception : elle est visible dans
// cette page. Ce qui protège les données, ce sont les règles RLS de
// supabase-schema.sql — sans compte utilisateur valide, l'API ne renvoie
// rien. Ne jamais mettre ici la clé « secret » / service_role.
// ============================================================

const CONFIGURED = SUPABASE_URL.indexOf('COLLEZ_ICI') === -1;

// Le rôle vient du compte, plus d'un interrupteur : un ouvrier ne peut
// plus basculer en vue bureau. Il est lu dans app_metadata, que
// l'utilisateur ne peut pas modifier lui-même.
function estPatron() {
  return !!(session && session.user && session.user.app_metadata
            && session.user.app_metadata.role === 'patron');
}
function prenomConnecte() {
  const u = session && session.user;
  if (!u) return '';
  if (u.user_metadata && u.user_metadata.nom) return u.user_metadata.nom;
  const l = (u.email || '').split('@')[0];
  return l ? l.charAt(0).toUpperCase() + l.slice(1) : '';
}

let equipe = [];   // [{id, nom, role}] — rempli à la connexion, pour le patron
let activeTab = 'chantiers', filterStatut = 'tous';
let currentChantier = null;
let chantiers = [];

// ============================================================
// OUTILS
// ============================================================

// Toutes les données affichées viennent du terrain et transitent par
// Sheets. Sans échappement, un client « L'Épine » ou « Dupont & Fils »
// casse le HTML généré — et une saisie malveillante y injecterait du JS.
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ============================================================
// SESSION
// ============================================================

let session = null;
try { session = JSON.parse(localStorage.getItem('jardinator_session') || 'null'); } catch (e) {}

function setSession(s) {
  session = s;
  if (s) localStorage.setItem('jardinator_session', JSON.stringify(s));
  else localStorage.removeItem('jardinator_session');
}

async function seConnecter(email, motDePasse) {
  const r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, password: motDePasse })
  });
  const d = await r.json();
  if (!r.ok || !d.access_token) throw new Error(d.error_description || d.msg || 'Connexion refusée');
  setSession(d);
  return d;
}

// Le jeton d'accès expire au bout d'une heure. Sans ce renouvellement,
// l'ouvrier serait déconnecté en plein chantier.
async function rafraichirSession() {
  if (!session || !session.refresh_token) return false;
  try {
    const r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: session.refresh_token })
    });
    const d = await r.json();
    if (!r.ok || !d.access_token) return false;
    setSession(d);
    return true;
  } catch (e) { return false; }
}

function seDeconnecter() {
  if (getQueue().length && !confirm('Des modifications ne sont pas encore envoyées. Elles seront perdues. Se déconnecter quand même ?')) return;
  couperTempsReel();
  // Le cache local doit partir avec la session. Sinon le suivant à se
  // connecter sur ce téléphone voit les chantiers du précédent — noms,
  // adresses, consignes — tant qu'il n'a pas de réseau. Tout le
  // cloisonnement repose sur le filtrage serveur ; ce cache le
  // contournerait localement.
  localStorage.removeItem('jardinator_chantiers');
  localStorage.removeItem('jardinator_queue');
  localStorage.removeItem('jardinator_rejets');
  localStorage.removeItem(DRAFT_KEY);
  try { indexedDB.deleteDatabase('jardinator'); } catch (e) {}
  setSession(null);
  location.reload();
}

// ============================================================
// APPELS SUPABASE
// ============================================================
//
// Un seul point de passage : il ajoute les en-têtes, et sur un 401 il
// renouvelle le jeton puis rejoue la requête une fois.

async function sb(chemin, opts, rejoue) {
  opts = opts || {};
  const h = Object.assign({ apikey: SUPABASE_KEY }, opts.headers || {});
  if (session && session.access_token) h.Authorization = 'Bearer ' + session.access_token;

  const res = await fetch(SUPABASE_URL + chemin, Object.assign({}, opts, { headers: h }));
  if (res.status === 401 && !rejoue && await rafraichirSession()) {
    return sb(chemin, opts, true);
  }
  return res;
}

async function sbJson(chemin, opts) {
  const res = await sb(chemin, opts);
  if (!res.ok) {
    // Le code HTTP est attaché à l'erreur : c'est lui qui permet à la
    // file de distinguer « le réseau est tombé, je retenterai » de
    // « le serveur a refusé, insister ne servira à rien ».
    const err = new Error('HTTP ' + res.status + ' ' + (await res.text()).slice(0, 200));
    err.statut = res.status;
    throw err;
  }
  const t = await res.text();
  return t ? JSON.parse(t) : null;
}

const REST = '/rest/v1/chantiers';

// ---------- Stockage de fichiers ----------

function cheminFichier(chantierId, nom) {
  return 'chantiers/' + chantierId + '/' + nom;
}

async function televerser(chemin, dataUrl) {
  const blob = await (await fetch(dataUrl)).blob();
  const res = await sb('/storage/v1/object/' + BUCKET + '/' + chemin, {
    method: 'POST',
    headers: { 'Content-Type': blob.type || 'application/octet-stream', 'x-upsert': 'true' },
    body: blob
  });
  if (!res.ok) { const e = new Error('upload ' + res.status); e.statut = res.status; throw e; }
  return chemin;
}

// Bucket privé : le fichier n'est servi qu'avec un jeton valide, il n'y
// a aucune URL publique vers les photos de tes clients.
async function telecharger(chemin) {
  const res = await sb('/storage/v1/object/authenticated/' + BUCKET + '/' + chemin);
  if (!res.ok) return null;
  const blob = await res.blob();
  return new Promise(r => {
    const fr = new FileReader();
    fr.onload = () => r(fr.result);
    fr.onerror = () => r(null);
    fr.readAsDataURL(blob);
  });
}

function supprimerFichier(chemin) {
  return sb('/storage/v1/object/' + BUCKET + '/' + chemin, { method: 'DELETE' }).catch(() => null);
}

// ---------- Conversion base de données <-> app ----------

function versApp(r) {
  return {
    id: r.id, statut: r.statut, client: r.client, adresse: r.adresse,
    devis: r.devis || '', devisPath: r.devis_path || null,
    consignes: r.consignes || '', notes: r.notes || '',
    date: r.date_prevue || '', dateTermine: r.date_termine || '',
    assignes: Array.isArray(r.assignes) ? r.assignes : [],
    photos: Array.isArray(r.photos) ? r.photos : [],
    nbPhotos: Array.isArray(r.photos) ? r.photos.length : 0
  };
}

function versDb(ch) {
  // Un ouvrier ne renvoie que ce qu'il a réellement modifié. Sinon,
  // clôturer à midi avec la copie chargée le matin réécrirait l'adresse
  // et les consignes dans leur ancienne version, effaçant sans un mot la
  // correction faite entre-temps par le patron.
  const d = {
    id: ch.id,
    statut: ch.statut || 'À faire',
    notes: ch.notes || '',
    date_termine: ch.statut === 'Terminé' ? (ch.dateTermine || todayFr()) : ''
  };
  if (estPatron()) {
    d.client = ch.client || '';
    d.adresse = ch.adresse || '';
    d.devis = ch.devis === '—' ? '' : (ch.devis || '');
    d.consignes = ch.consignes || '';
    d.date_prevue = ch.date || '';
    d.assignes = ch.assignes || [];
  }
  return d;
}

function todayFr() { return new Date().toLocaleDateString('fr-FR'); }

function nouvelleCle(prefixe) {
  return prefixe + '-' + Date.now() + '-' + Math.floor(Math.random() * 100000);
}

// ============================================================
// FICHIERS LOCAUX (IndexedDB)
// ============================================================
//
// localStorage plafonne à ~5 Mo et ne stocke que du texte : une seule
// photo compressée en occuperait déjà 8 %. IndexedDB sert donc à la fois
// de tampon d'envoi (photo prise hors réseau) et de cache d'affichage
// (photo déjà vue, plus jamais retéléchargée).

// Délai maximal accordé au stockage local. Sans lui, une base bloquée
// — autre onglet ouvert, navigation privée, profil corrompu — fige
// l'attente indéfiniment : le bouton photo ne répondrait plus, sans le
// moindre message.
const IDB_DELAI = 6000;

function avecDelai(promesse, message) {
  return Promise.race([
    promesse,
    new Promise((_, rej) => setTimeout(() => rej(new Error(message)), IDB_DELAI))
  ]);
}

let _db = null;
function db() {
  if (_db) return _db;
  _db = avecDelai(new Promise((res, rej) => {
    let r;
    try { r = indexedDB.open('jardinator', 1); } catch (e) { return rej(e); }
    r.onupgradeneeded = () => r.result.createObjectStore('fichiers');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('base verrouillée par un autre onglet'));
  }), 'ouverture du stockage local trop lente')
    // On oublie l'échec pour qu'une tentative ultérieure puisse réussir.
    .catch(e => { _db = null; throw e; });
  return _db;
}

function fichierTx(mode, action) {
  return avecDelai(
    db().then(d => new Promise((res, rej) => {
      const req = action(d.transaction('fichiers', mode).objectStore('fichiers'));
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    })),
    'stockage local trop lent'
  ).catch(e => {
    console.warn('Jardinator : stockage local indisponible —', e && e.message);
    return null;
  });
}

const fichierGet = cle      => fichierTx('readonly',  s => s.get(cle));
const fichierSet = (cle, v) => fichierTx('readwrite', s => s.put(v, cle));
const fichierDel = cle      => fichierTx('readwrite', s => s.delete(cle));

// ============================================================
// PHOTOS — capture et compression
// ============================================================

const PHOTO_MAX_PX  = 1600;   // suffisant pour un constat de chantier
const PHOTO_QUALITE = 0.75;   // ~250-400 Ko par photo

function choisirFichiers(accept, multiple) {
  return new Promise(res => {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = accept;
    inp.multiple = !!multiple;
    // Pas d'attribut « capture » : iOS propose alors Appareil photo OU
    // Photothèque. Le forcer priverait l'ouvrier de ses photos déjà prises.
    inp.onchange = () => res(Array.from(inp.files || []));
    inp.click();
  });
}

function lireFichier(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = () => rej(fr.error);
    fr.readAsDataURL(file);
  });
}

// Une photo de téléphone fait 3 à 8 Mo : intransportable sur un réseau
// de chantier. On redimensionne avant tout envoi.
async function compresser(file) {
  let bitmap;
  try {
    // imageOrientation : sans ça, une photo prise en portrait ressort
    // couchée, l'EXIF étant perdu au passage par le canvas.
    bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch (e) {
    return lireFichier(file);   // navigateur trop ancien : on envoie tel quel
  }
  const ratio = Math.min(1, PHOTO_MAX_PX / Math.max(bitmap.width, bitmap.height));
  const w = Math.round(bitmap.width * ratio), h = Math.round(bitmap.height * ratio);
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  cv.getContext('2d').drawImage(bitmap, 0, 0, w, h);
  bitmap.close();
  return cv.toDataURL('image/jpeg', PHOTO_QUALITE);
}

// Source d'affichage d'une photo : cache local d'abord, puis le proxy
// Le bucket est privé : aucune URL publique vers les fichiers —
// aucune photo de propriété de client n'est mise en lien public.
async function photoSrc(p) {
  if (p.cle) {
    const local = await fichierGet(p.cle);
    if (local) return local;
  }
  if (p.path) {
    const ck = 'file-' + p.path;
    const cache = await fichierGet(ck);
    if (cache) return cache;
    try {
      const d = await telecharger(p.path);
      if (d) { fichierSet(ck, d); return d; }
    } catch (e) {}
  }
  return null;
}

// ============================================================
// STOCKAGE LOCAL
// ============================================================

function saveChantiers() {
  try {
    localStorage.setItem('jardinator_chantiers', JSON.stringify(chantiers));
  } catch (e) {
    // Quota dépassé : rien à purger ici, les photos sont en IndexedDB.
    console.warn('Stockage local saturé', e);
  }
}

function loadLocal() {
  try { return JSON.parse(localStorage.getItem('jardinator_chantiers') || '[]'); }
  catch (e) { return []; }
}

// ============================================================
// FILE D'ATTENTE HORS-LIGNE
// ============================================================
//
// L'app tourne en camion, sur du réseau qui tombe. Toute écriture est
// d'abord persistée en local puis empilée ici ; la file est rejouée dès
// que le réseau revient. Sans ça, un chantier créé hors-ligne était
// effacé par la synchronisation suivante.

function getQueue() {
  try { return JSON.parse(localStorage.getItem('jardinator_queue') || '[]'); }
  catch (e) { return []; }
}
function setQueue(q) { localStorage.setItem('jardinator_queue', JSON.stringify(q)); }
function pendingIds() { return new Set(getQueue().map(op => op.id)); }

function enqueue(op) {
  const q = getQueue();
  // Une seule opération en attente par (type, chantier) : la dernière
  // gagne. Les photos font exception — plusieurs par chantier — d'où la
  // clé dans la comparaison.
  const i = q.findIndex(x => x.type === op.type && x.id === op.id && (x.cle || '') === (op.cle || ''));
  if (i >= 0) q[i] = op; else q.push(op);
  setQueue(q);
  updateQueueBanner();
  flushQueue();
}

// Tout passage par PATCH exige return=representation : sans lui, une
// mise à jour qu'aucune ligne n'autorise renvoie 204 comme si tout
// allait bien, et la modification est perdue en silence.
// Appel d'une fonction Postgres. Les refus RLS y remontent en 403,
// donc la file les traite comme n'importe quel autre refus définitif.
function rpc(nom, args) {
  return sbJson('/rest/v1/rpc/' + nom, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(args)
  });
}

async function patchChantier(id, corps) {
  const lignes = await sbJson(REST + '?id=eq.' + encodeURIComponent(id), {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', Prefer: 'return=representation' },
    body: JSON.stringify(corps)
  });
  if (!lignes || !lignes.length) {
    const e = new Error('aucune ligne modifiée');
    e.statut = 403;   // chantier supprimé, ou retiré à cet utilisateur
    throw e;
  }
  return lignes[0];
}

async function executerOp(op) {
  if (op.type === 'create') {
    // merge-duplicates : rejouer la création ne produit pas de doublon.
    await sbJson(REST, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates' },
      body: JSON.stringify([op.payload])
    });
    return true;
  }
  if (op.type === 'save') {
    await patchChantier(op.id, op.payload);
    return true;
  }
  if (op.type === 'delete') {
    // Même piège que le PATCH : un DELETE que RLS bloque renvoie 204.
    // Sans la représentation, un ouvrier croirait avoir supprimé.
    const lignes = await sbJson(REST + '?id=eq.' + encodeURIComponent(op.id), {
      method: 'DELETE', headers: { Prefer: 'return=representation' }
    });
    if (!lignes || !lignes.length) {
      const e = new Error('aucune ligne supprimée'); e.statut = 403; throw e;
    }
    return true;
  }
  if (op.type === 'deletePhoto') {
    // Retirer le fichier ne suffit pas : sans le retrait de l'entrée, la
    // synchro suivante réaffiche la photo — case morte sur les autres
    // téléphones, puisque le fichier n'existe plus.
    await rpc('retirer_photo', { p_id: op.id, p_path: op.path });
    await supprimerFichier(op.path);
    return true;
  }

  const dataUrl = await fichierGet(op.cle);
  if (!dataUrl) {
    // Blob introuvable (cache vidé, écriture locale échouée). On abandonne
    // l'opération pour ne pas bloquer la file — mais sans le dire, un
    // fichier disparaîtrait sans laisser de trace.
    console.warn('Jardinator : fichier local introuvable, envoi abandonné', op.type, op.cle);
    return true;
  }
  return envoyerFichier(op, dataUrl);
}

// Opérations définitivement refusées par le serveur. Elles sont sorties
// de la file pour ne pas bloquer le reste, mais conservées et signalées :
// une modification ne doit jamais disparaître en silence.
function getRejets() {
  try { return JSON.parse(localStorage.getItem('jardinator_rejets') || '[]'); }
  catch (e) { return []; }
}
function setRejets(r) { localStorage.setItem('jardinator_rejets', JSON.stringify(r.slice(-20))); }

function decrireOp(op) {
  const ch = chantiers.find(c => c.id === op.id);
  const qui = ch ? ch.client : op.id;
  return ({ save: 'Modification de ' + qui, create: 'Création de ' + qui,
            delete: 'Suppression de ' + qui,
            photo: 'Photo de ' + qui, devis: 'Devis de ' + qui,
            deletePhoto: 'Photo supprimée de ' + qui })[op.type]
         || (op.type + ' — ' + qui);
}

function messageRefus(statut) {
  if (statut === 403) return "Ce chantier ne vous est plus assigné.";
  if (statut === 404) return "Ce chantier n'existe plus.";
  if (statut === 409) return "Conflit avec une modification faite ailleurs.";
  if (statut === 413) return "Fichier trop volumineux.";
  return "Refusé par le serveur (code " + statut + ").";
}

// Retire de la file l'opération traitée, en la comparant à ce qu'elle
// était. Si elle a été remplacée entre-temps, on la laisse : elle sera
// envoyée au tour suivant.
function retirerOp(op) {
  const q = getQueue();
  const i = q.findIndex(x => x.type === op.type && x.id === op.id && (x.cle || '') === (op.cle || ''));
  if (i < 0) return q;
  if (JSON.stringify(q[i]) !== JSON.stringify(op)) { relanceDemandee = true; return q; }
  q.splice(i, 1);
  setQueue(q);
  return q;
}

let flushing = false, relanceDemandee = false;
async function flushQueue() {
  // Un envoi est déjà en cours : on note qu'il faudra recommencer plutôt
  // que d'abandonner. Sans ça, une opération empilée pendant l'envoi
  // (typiquement une photo, ajoutée juste après la fiche) attendait
  // le prochain passage automatique.
  if (flushing) { relanceDemandee = true; return; }
  if (!CONFIGURED || !session || !navigator.onLine) return;
  flushing = true;
  try {
    let q = getQueue();
    while (q.length) {
      const op = q[0];
      let ok = false, statut = 0;

      try { ok = await executerOp(op); }
      catch (e) { ok = false; statut = e.statut || 0; }

      if (ok) {
        // On retire l'opération PAR IDENTITÉ, pas par position. Pendant
        // l'await, l'utilisateur a pu agir : enqueue() remplace alors
        // l'entrée de tête, et un slice(1) jetterait cette nouvelle
        // version sans jamais l'avoir envoyée.
        q = retirerOp(op);
        continue;
      }

      // Session expirée : insister ne sert à rien, l'utilisateur doit se
      // reconnecter. On garde l'opération intacte pour plus tard.
      if (statut === 401) { sessionPerdue(); break; }

      // Refus définitif : rejouer donnera toujours le même résultat.
      // Sans cette sortie, l'opération bloquerait indéfiniment tout ce
      // qui la suit — photos et clôtures des autres chantiers compris.
      if (statut >= 400 && statut < 500) {
        const r = getRejets();
        r.push({ quoi: decrireOp(op), pourquoi: messageRefus(statut),
                 quand: new Date().toLocaleString('fr-FR') });
        setRejets(r);
        console.warn('Jardinator : opération refusée, mise de côté', op, statut);
        q = retirerOp(op);
        continue;
      }

      // Panne réseau ou serveur indisponible : on retentera plus tard,
      // sans toucher à l'ordre — une photo ne doit pas partir avant la
      // création du chantier auquel elle se rattache.
      break;
    }
  } finally {
    flushing = false;
    updateQueueBanner();
    if (relanceDemandee) { relanceDemandee = false; setTimeout(flushQueue, 0); }
  }
}

// Téléverse le fichier puis rattache son chemin à la ligne du chantier.
// L'ordre compte : tant que le fichier n'est pas dans le bucket, écrire
// son chemin en base pointerait vers le vide.
async function envoyerFichier(op, dataUrl) {
  if (op.type === 'devis') {
    const nom = (op.nom || 'devis.pdf').replace(/[^\w.\-]/g, '_');
    const chemin = await televerser(cheminFichier(op.id, 'devis-' + nom), dataUrl);
    await patchChantier(op.id, { devis_path: chemin, devis: op.nom || 'Devis' });
    rattacher(op, { devisPath: chemin });
    return true;
  }

  // photo — l'ajout à la liste est fait par la base en une instruction.
  // Un « lire, ajouter, réécrire » côté app effacerait la photo qu'un
  // collègue aurait insérée entre les deux.
  const chemin = await televerser(cheminFichier(op.id, 'photo-' + op.cle + '.jpg'), dataUrl);
  await rpc('ajouter_photo', {
    p_id: op.id,
    p_photo: { path: chemin, nom: op.nom || 'photo.jpg', cle: op.cle }
  });
  rattacher(op, { path: chemin });
  return true;
}

// L'entrée locale reçoit le chemin distant : la vignette déjà en cache
// continue de servir au lieu d'être retéléchargée.
function rattacher(op, res) {
  const ch = chantiers.find(c => c.id === op.id);
  if (!ch) return;
  if (op.type === 'photo') {
    const p = (ch.photos || []).find(x => x.cle === op.cle);
    if (p) p.path = res.path;
    ch.nbPhotos = (ch.photos || []).length;
  } else if (op.type === 'devis') {
    ch.devisPath = res.devisPath;
    }
  saveChantiers();
  if (currentChantier && currentChantier.id === op.id && !document.getElementById('viewer')) {
    const flag = document.querySelector('.photo-cell[data-cle="' + op.cle + '"] .photo-flag');
    if (flag) flag.remove();
  }
}

// Jeton irrécupérable (mot de passe changé, projet en pause, session
// révoquée). Sans ce signal, l'app restait indéfiniment sur « envoi en
// cours » sans que personne ne sache qu'il fallait se reconnecter.
let alerteSession = false;
function sessionPerdue() {
  if (alerteSession) return;
  alerteSession = true;
  const el = document.getElementById('queue-banner');
  if (el) {
    el.style.display = 'block';
    el.style.background = 'var(--rouge-light)';
    el.style.color = 'var(--rouge-dark)';
    el.textContent = '⚠ Session expirée — reconnectez-vous pour envoyer vos modifications';
    el.onclick = () => { couperTempsReel(); setSession(null); location.reload(); };
  }
}

function updateQueueBanner() {
  if (alerteSession) return;   // message plus important déjà affiché
  const el = document.getElementById('queue-banner');
  if (!el) return;
  const n = getQueue().length;
  const rejets = getRejets().length;

  // Un refus prime sur l'attente : c'est le seul cas qui demande une
  // action de la part de quelqu'un.
  if (rejets) {
    el.style.display = 'block';
    el.style.background = 'var(--rouge-light)';
    el.style.color = 'var(--rouge-dark)';
    el.textContent = '⚠ ' + rejets + ' modification(s) refusée(s) — voir ' +
                     (estPatron() ? 'Dashboard' : 'Mon compte');
    return;
  }

  el.style.background = 'var(--amber-light)';
  el.style.color = 'var(--amber)';
  if (!n) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.textContent = navigator.onLine
    ? '⏳ ' + n + ' modification(s) en cours d\'envoi…'
    : '📴 Hors ligne — ' + n + ' modification(s) seront envoyées au retour du réseau';
}

function viderRejets() {
  if (!confirm('Effacer la liste des modifications refusées ?')) return;
  localStorage.removeItem('jardinator_rejets');
  updateQueueBanner();
  render();
}

window.addEventListener('online', () => { updateQueueBanner(); flushQueue(); });
window.addEventListener('offline', updateQueueBanner);

// ============================================================
// SYNCHRONISATION
// ============================================================

// Vrai dès que l'utilisateur a quelque chose à l'écran qu'un re-render
// détruirait. C'était LE bug : la synchronisation auto toutes les 30 s
// appelait render(), qui régénérait le formulaire — et effaçait la
// saisie en cours.
function isEditing() {
  if (currentChantier) return true;
  if (activeTab === 'nouveau') return true;
  const el = document.activeElement;
  return !!(el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
}

async function loadFromSheets(silent) {
  if (!CONFIGURED || !session) { chantiers = loadLocal(); render(); return; }
  // Le voile remplace tout le contenu. Par-dessus une fiche ouverte, il
  // effacerait la saisie en cours et l'écran resterait bloqué dessus,
  // puisque le rendu final est justement inhibé pendant une saisie.
  if (!silent && !currentChantier) showLoader();
  const avantIds = new Set(chantiers.map(c => c.id));
  try {
    const rows = await sbJson(REST + '?select=*&order=maj_le.desc');
    chantiers = mergeRemote((rows || []).map(versApp));
    saveChantiers();
    signalerNouveaux(avantIds);
    updateRefreshIndicator(true);
  } catch (e) {
    // loadLocal() reconstruit des objets neufs : sans ce raccrochage,
    // currentChantier pointerait sur un objet absent du tableau, et tout
    // ce qui serait tapé ensuite ne serait jamais enregistré.
    chantiers = loadLocal();
    if (currentChantier) {
      const i = chantiers.findIndex(c => c.id === currentChantier.id);
      if (i >= 0) chantiers[i] = currentChantier;
    }
    updateRefreshIndicator(false);
  }
  if (!isEditing()) render();
}

// Le serveur ne fait pas autorité sur tout : ce qui est encore dans la
// file d'attente n'y est pas encore monté.
function mergeRemote(remote) {
  const pending = pendingIds();
  const local = {};
  chantiers.forEach(c => { local[c.id] = c; });

  const merged = remote.map(r => {
    const l = local[r.id];
    if (!l) return r;
    // La version locale l'emporte tant qu'elle n'est pas montée, et tant
    // que la fiche est ouverte à l'écran : sinon currentChantier
    // pointerait sur un objet que le tableau ne contient plus, et les
    // modifications suivantes partiraient dans le vide.
    if (pending.has(r.id)) return l;
    if (currentChantier && currentChantier.id === r.id) return l;
    return r;
  });

  const remoteIds = new Set(remote.map(r => r.id));
  chantiers.forEach(l => {
    if (!remoteIds.has(l.id) && pending.has(l.id)) merged.unshift(l);
  });
  return merged;
}

// Deux opérations distinctes, et ce n'est pas cosmétique : créer exige
// le droit INSERT, réservé au patron. Un upsert (POST) demande ce droit
// même quand il ne fait que mettre à jour — un ouvrier ne pourrait donc
// rien enregistrer. Les modifications passent en PATCH, que les ouvriers
// ont sur leurs chantiers.
function syncChantier(ch) {
  enqueue({ type: 'save', id: ch.id, payload: versDb(ch) });
}

function creerDistant(ch) {
  enqueue({ type: 'create', id: ch.id, payload: versDb(ch) });
}

function updateRefreshIndicator(ok) {
  const btn = document.getElementById('refresh-btn');
  if (!btn) return;
  btn.textContent = ok ? '🔄' : '⚠️';
  setTimeout(() => { if (btn) btn.textContent = '🔄'; }, 2000);
}

// Rafraîchissement auto — mais jamais pendant une saisie.
// Conservé même avec le temps réel : c'est le filet si le WebSocket
// tombe, ou si le réseau du camion coupe la connexion permanente.
setInterval(() => { if (!isEditing()) loadFromSheets(true); }, 30000);
setInterval(flushQueue, 5000);

// ============================================================
// TEMPS RÉEL
// ============================================================
//
// WebSocket Supabase : Lucas assigne un chantier, il apparaît chez
// l'ouvrier dans la seconde au lieu d'attendre le prochain sondage.
//
// Volontairement écrit pour ne jamais casser l'app : la moindre erreur
// se solde par un retour au sondage 30 s. Le temps réel accélère, il ne
// remplace rien.

let ws = null, wsBattement = null, wsRelance = null, wsRef = 0;

function tempsReel() {
  if (!CONFIGURED || !session || ws) return;
  try {
    ws = new WebSocket(SUPABASE_URL.replace(/^http/, 'ws') + '/realtime/v1/websocket?apikey=' +
                       encodeURIComponent(SUPABASE_KEY) + '&vsn=1.0.0');
  } catch (e) { return; }

  ws.onopen = () => {
    // Le jeton de session est transmis : le serveur applique les mêmes
    // règles qu'en lecture normale, un ouvrier n'est averti que de ses
    // propres chantiers.
    envoyerWs('realtime:chantiers', 'phx_join', {
      config: {
        postgres_changes: [{ event: '*', schema: 'public', table: 'chantiers' }],
        private: false
      },
      access_token: session.access_token
    });
    clearInterval(wsBattement);
    wsBattement = setInterval(() => envoyerWs('phoenix', 'heartbeat', {}), 25000);
  };

  ws.onmessage = (msg) => {
    let d;
    try { d = JSON.parse(msg.data); } catch (e) { return; }
    if (d.event === 'postgres_changes' && !isEditing()) loadFromSheets(true);
  };

  ws.onclose = ws.onerror = () => {
    clearInterval(wsBattement);
    ws = null;
    // Reconnexion espacée : inutile de marteler un réseau absent, le
    // sondage assure déjà la continuité.
    clearTimeout(wsRelance);
    if (session) wsRelance = setTimeout(tempsReel, 15000);
  };
}

function envoyerWs(topic, event, payload) {
  if (!ws || ws.readyState !== 1) return;
  try { ws.send(JSON.stringify({ topic: topic, event: event, payload: payload, ref: String(++wsRef) })); }
  catch (e) {}
}

// ============================================================
// ALERTES
// ============================================================
//
// Alerte système affichée quand l'app est OUVERTE. Elle ne réveille pas
// un téléphone verrouillé : cela demanderait un service d'envoi de
// notifications et un serveur, hors de portée ici.

function alertesActives() {
  return ('Notification' in window) && Notification.permission === 'granted';
}

function demanderAlertes() {
  if (!('Notification' in window)) { alert("Ce navigateur ne gère pas les alertes."); return; }
  Notification.requestPermission().then(() => render());
}

function notifier(titre, corps) {
  if (!alertesActives()) return;
  try { new Notification(titre, { body: corps, icon: 'icon-192.png', tag: 'jardinator' }); }
  catch (e) {}
}

// Compare l'avant et l'après d'une synchro pour repérer ce qui vient
// d'arriver. Silencieux au tout premier chargement, sinon l'ouvrier
// recevrait une alerte par chantier existant.
function signalerNouveaux(avantIds) {
  if (!avantIds.size || estPatron()) return;
  const nouveaux = chantiers.filter(c => !avantIds.has(c.id) && c.statut !== 'Terminé');
  if (!nouveaux.length) return;
  notifier(
    nouveaux.length === 1 ? 'Nouveau chantier : ' + nouveaux[0].client
                          : nouveaux.length + ' nouveaux chantiers',
    nouveaux.map(c => c.adresse).join(' · ')
  );
}

function couperTempsReel() {
  clearInterval(wsBattement); clearTimeout(wsRelance);
  if (ws) { try { ws.close(); } catch (e) {} ws = null; }
}

function showLoader() {
  document.getElementById('content').innerHTML =
    '<div style="text-align:center;padding:60px 20px;color:#999">' +
    '<div style="font-size:40px;margin-bottom:16px">🌹</div>' +
    '<div style="font-size:15px;font-weight:500;color:var(--noir);margin-bottom:8px">Chargement des chantiers…</div>' +
    '<div style="font-size:13px">Synchronisation en cours</div></div>';
}

// ============================================================
// NAVIGATION
// ============================================================

// L'interface se cale sur le compte connecté, une fois pour toutes.
function appliquerRole() {
  const patron = estPatron();
  document.getElementById('role-label').textContent = patron ? 'Vue Bureau' : 'Vue Terrain';
  document.getElementById('topbar-sub').textContent = patron
    ? 'Gestion des interventions'
    : 'Mes chantiers — ' + prenomConnecte();

  document.getElementById('tab-bar').innerHTML = patron
    ? '<div class="tab active" id="tab-chantiers" onclick="switchTab(\'chantiers\')">Chantiers</div>' +
      '<div class="tab" id="tab-nouveau" onclick="switchTab(\'nouveau\')">+ Nouveau</div>' +
      '<div class="tab" id="tab-stats" onclick="switchTab(\'stats\')">Dashboard</div>'
    : '<div class="tab active" id="tab-chantiers" onclick="switchTab(\'chantiers\')">Mes chantiers</div>' +
      '<div class="tab" id="tab-stats" onclick="switchTab(\'stats\')">Mon compte</div>';

  activeTab = 'chantiers';
  filterStatut = 'tous';
}

// Liste des ouvriers pour le menu « Assigné à ». Inutile côté terrain.
// Chargée pour tout le monde : l'ouvrier en a besoin pour lire le nom
// des collègues affectés au même chantier. La vue n'expose que
// identifiant, prénom et rôle.
async function chargerEquipe() {
  try {
    equipe = (await sbJson('/rest/v1/equipe?select=id,nom,role&order=nom')) || [];
  } catch (e) { equipe = []; }
}

function nomDe(id) {
  const m = equipe.find(u => u.id === id);
  return m ? m.nom : (id ? 'Ouvrier inconnu' : 'Non assigné');
}

function nomsDe(ids) {
  return (ids || []).map(nomDe).join(', ') || 'Personne';
}

// Sélection en cours dans le formulaire de création (le chantier
// n'existe pas encore, donc pas de fiche où stocker).
let assignesNouveau = [];

// Liste à cocher : plusieurs ouvriers sur un même chantier, cas courant
// en élagage où l'on part rarement seul.
function casesOuvriers(selection, action) {
  const ouvriers = equipe.filter(u => u.role !== 'patron');
  if (!ouvriers.length) return '<div style="font-size:13px;color:#999">Aucun ouvrier enregistré.</div>';
  return ouvriers.map(u => {
    const coche = (selection || []).indexOf(u.id) > -1;
    return '<label style="display:flex;align-items:center;gap:10px;padding:11px 12px;background:white;' +
      'border:1px solid ' + (coche ? 'var(--rouge)' : '#ddd') + ';border-radius:10px;margin-bottom:8px;cursor:pointer">' +
      '<input type="checkbox" style="width:20px;height:20px;accent-color:var(--rouge);flex-shrink:0" ' +
        (coche ? 'checked ' : '') + 'onchange="' + action + '(\'' + esc(u.id) + '\', this.checked)">' +
      '<span style="font-size:15px;color:var(--noir)">' + esc(u.nom) + '</span></label>';
  }).join('');
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const el = document.getElementById('tab-' + tab);
  if (el) el.classList.add('active');
  currentChantier = null; render();
}

function render() {
  const c = document.getElementById('content');
  if (currentChantier) renderDetail(c);
  else if (activeTab === 'chantiers') renderList(c);
  else if (activeTab === 'nouveau') renderNouveau(c);
  else if (activeTab === 'stats') renderStats(c);
  // Les écrans sans grille photo n'ont aucune cellule à remplir : no-op.
  setTimeout(remplirPhotos, 0);
}

function badgeHtml(s) {
  const cls = s === 'À faire' ? 'badge-todo' : s === 'En cours' ? 'badge-inprogress' : 'badge-done';
  const dot = s === 'À faire' ? '#BA7517' : s === 'En cours' ? '#185FA5' : '#2E7D32';
  return '<span class="badge ' + cls + '"><span style="width:6px;height:6px;border-radius:50%;background:' + dot +
    ';display:inline-block"></span>' + esc(s) + '</span>';
}

// ============================================================
// LISTE
// ============================================================

function renderList(c) {
  const patron = estPatron();

  // Côté terrain, la base ne renvoie déjà que les chantiers de l'ouvrier.
  // On filtre en plus sur le statut : « En cours » doit rester visible,
  // sinon un chantier démarré disparaît de l'écran de celui qui le fait.
  const list = patron
    ? (filterStatut === 'tous' ? chantiers : chantiers.filter(ch => ch.statut === filterStatut))
    : chantiers.filter(ch => ch.statut === 'À faire' || ch.statut === 'En cours');

  const chips = patron
    ? '<div class="chips">' + ['tous', 'À faire', 'En cours', 'Terminé'].map(s =>
        '<div class="chip ' + (filterStatut === s ? 'active' : '') + '" onclick="setFilter(\'' + esc(s) + '\')">' +
        (s === 'tous' ? 'Tous' : esc(s)) + '</div>').join('') + '</div>'
    : '';

  const pending = pendingIds();
  let cards = list.map(ch =>
    '<div class="card" data-id="' + esc(ch.id) + '">' +
      '<div class="card-header"><div class="card-name">' + esc(ch.client) + '</div>' + badgeHtml(ch.statut) + '</div>' +
      '<div class="card-address">📍 ' + esc(ch.adresse) + '</div>' +
      // Le patron a besoin de voir d'un coup d'œil qui est sur quoi.
      (patron
        ? '<div style="font-size:12px;color:' + ((ch.assignes || []).length ? 'var(--blue)' : '#c0392b') + ';margin-bottom:6px">' +
          ((ch.assignes || []).length ? '👷 ' + esc(nomsDe(ch.assignes)) : '⚠ Personne assigné') + '</div>'
        : '') +
      '<div style="display:flex;justify-content:space-between;align-items:center">' +
        '<span style="font-size:12px;color:#999">' + esc(ch.id) + ' · ' + esc(ch.date) +
        (pending.has(ch.id) ? ' · ⏳' : '') + '</span>' +
        (ch.consignes ? '<div class="card-consigne">⚠ Consignes</div>' : '') +
      '</div>' +
    '</div>').join('');

  if (!list.length) {
    cards = '<div class="empty-state"><div style="font-size:48px;margin-bottom:12px">🌹</div>' +
      '<div style="font-size:16px;font-weight:500">Aucun chantier</div>' +
      (!patron ? '<div style="font-size:14px;margin-top:6px">Aucun chantier ne t\'est assigné pour le moment</div>' : '') + '</div>';
  }

  const title = patron ? 'Tous les chantiers' : "Mes chantiers à faire";
  c.innerHTML = '<div class="section-title">' + title + ' (' + list.length + ')</div>' + chips + cards;
}

function setFilter(f) { filterStatut = f; render(); }

// Délégation d'événement plutôt qu'un onclick="openChantier('...')" par
// carte : l'id n'a plus à survivre à une interpolation dans un attribut.
document.getElementById('content').addEventListener('click', e => {
  const card = e.target.closest('.card[data-id]');
  if (card) openChantier(card.getAttribute('data-id'));
});

// ============================================================
// FICHE CHANTIER
// ============================================================

function openChantier(id) {
  const ch = chantiers.find(c => c.id === id);
  if (!ch) { alert('Cette fiche n\'existe plus.'); currentChantier = null; render(); return; }
  currentChantier = ch;
  notesInitiales = ch.notes || '';
  render();
}

function renderDetail(c) {
  const ch = currentChantier;
  const isTermine = ch.statut === 'Terminé';
  const enAttente = pendingIds().has(ch.id);

  c.innerHTML =
    '<div class="back-btn" onclick="quitterFiche()">← Retour</div>' +
    '<div class="id-badge">' + esc(ch.id) + '</div>' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">' +
      '<div style="font-size:22px;font-weight:700;color:var(--noir)">' + esc(ch.client) + '</div>' + badgeHtml(ch.statut) +
    '</div>' +
    (enAttente ? '<div class="alert-warning">⏳ Modifications enregistrées sur l\'appareil, envoi en attente.</div>' : '') +
    '<div class="detail-row">' +
      '<div class="detail-icon" style="background:var(--blue-light)">📍</div>' +
      '<div><div class="detail-main">' + esc(ch.adresse) + '</div><div class="detail-sub">Adresse d\'intervention</div></div>' +
    '</div>' +
    '<button class="gps-btn" onclick="openGPS()">🗺 Naviguer vers ce chantier</button>' +
    // Affectation : menu déroulant pour le patron, simple information
    // pour l'ouvrier — qui ne voit de toute façon que ses chantiers.
    (estPatron()
      ? '<div class="field-group" style="margin-top:12px">' +
        '<div class="field-label">👷 Ouvriers sur ce chantier</div>' +
        casesOuvriers(ch.assignes, 'basculerAssignation') +
        '<div class="draft-note" id="assigne-note"></div></div>'
      // L'ouvrier voit avec qui il travaille : utile pour s'organiser.
      : ((ch.assignes || []).length > 1
          ? '<div class="detail-row"><div class="detail-icon" style="background:var(--blue-light)">👷</div>' +
            '<div><div class="detail-main">' + esc(nomsDe(ch.assignes)) + '</div>' +
            '<div class="detail-sub">Sur ce chantier</div></div></div>'
          : '')) +
    (ch.consignes
      ? '<div class="detail-row"><div class="detail-icon" style="background:var(--rouge-light)">⚠</div>' +
        '<div><div class="detail-main" style="color:var(--rouge-dark)">' + esc(ch.consignes) + '</div>' +
        '<div class="detail-sub">Consignes d\'intervention</div></div></div>'
      : '') +
    '<div class="section-title" style="margin-top:14px">Devis</div>' +
    (ch.devisCle || ch.devisPath
      ? '<div class="file-chip"><span style="font-size:20px">📄</span>' +
        '<span class="file-chip-name">' + esc(ch.devis || 'Devis') + '</span>' +
        (ch.devisCle && !ch.devisPath ? '<span class="photo-flag" style="position:static;background:var(--amber)">⏳</span>' : '') +
        '<span style="font-size:13px;color:var(--blue);cursor:pointer;font-weight:600" onclick="ouvrirDevis()">Ouvrir</span></div>' +
        '<button class="gps-btn" onclick="joindreDevis()">📎 Remplacer le devis</button>'
      // Ancienne référence saisie à la main : on l'affiche sans prétendre
      // qu'un fichier existe.
      : (ch.devis && ch.devis !== '—'
          ? '<div class="file-chip"><span style="font-size:20px">🔖</span>' +
            '<span class="file-chip-name">' + esc(ch.devis) + '</span></div>'
          : '') +
        '<button class="gps-btn" onclick="joindreDevis()">📎 Joindre le devis (PDF)</button>') +
    '<div class="divider"></div>' +
    '<div class="section-title">Photos du chantier (' + ((ch.photos || []).length) + ')</div>' +
    grillePhotos(ch.photos || []) +
    '<div class="divider"></div>' +
    (isTermine
      ? '<div class="alert-success">✅ Chantier terminé' + (enAttente ? '.' : ' — fiche synchronisée.') + '</div>' +
        (ch.notes ? '<div class="field-group"><div class="field-label">Notes</div>' +
          '<div style="font-size:14px;color:var(--noir);line-height:1.5">' + esc(ch.notes) + '</div></div>' : '') +
        '<div class="divider"></div>'
      : '<div class="section-title">Compte-rendu de fin de chantier</div>' +
        '<div class="field-group">' +
          '<div class="field-label">📝 Notes de fin d\'intervention</div>' +
          '<textarea class="field-input" id="notes-field" oninput="saveNotesDraft()" ' +
            'placeholder="Ex : RAS, client satisfait. Broyat déposé au fond du jardin.">' + esc(ch.notes || '') + '</textarea>' +
          '<div class="draft-note" id="notes-draft"></div>' +
        '</div>' +
        '<div class="divider"></div>' +
        '<button class="btn btn-red" onclick="terminer()" id="btn-terminer">✅ Valider et terminer le chantier</button>') +
    // Réservé au patron : la base refuse la suppression aux ouvriers, et
    // proposer le geste leur ferait croire à un succès.
    (estPatron()
      ? '<button class="btn btn-gray" style="color:var(--rouge);border-color:var(--rouge-light)" onclick="supprimerChantier()">🗑 Supprimer cette fiche</button>'
      : '');
}

function quitterFiche() {
  saveNotesDraft();
  // Les notes ne partaient nulle part tant que le chantier n'était pas
  // clôturé : dès la fiche refermée, la synchro suivante les remplaçait
  // par la version du serveur. On les envoie en quittant.
  if (currentChantier && currentChantier.notes !== notesInitiales) syncChantier(currentChantier);
  currentChantier = null;
  render();
}

// Le patron coche ou décoche un ouvrier. Enregistré localement puis
// envoyé via la file : pas d'attente réseau, et ça marche depuis un
// chantier sans 4G.
function basculerAssignation(id, actif) {
  if (!currentChantier) return;
  const liste = currentChantier.assignes = currentChantier.assignes || [];
  const i = liste.indexOf(id);
  if (actif && i === -1) liste.push(id);
  else if (!actif && i > -1) liste.splice(i, 1);

  saveChantiers();
  syncChantier(currentChantier);

  const n = document.getElementById('assigne-note');
  if (n) {
    n.textContent = liste.length ? '✓ ' + nomsDe(liste) : '✓ Plus personne assigné';
    setTimeout(() => { if (n) n.textContent = ''; }, 2000);
  }
}

// Même chose dans le formulaire de création, avant que la fiche existe.
function basculerAssignationNouveau(id, actif) {
  const i = assignesNouveau.indexOf(id);
  if (actif && i === -1) assignesNouveau.push(id);
  else if (!actif && i > -1) assignesNouveau.splice(i, 1);
}

// Sauvegarde à la frappe. Sans ça, tout ce qui est tapé ne vit que dans
// le DOM : mise en veille du téléphone, appel entrant ou changement
// d'app suffisent à faire recharger la PWA et à tout perdre.
let notesTimer = null, notesInitiales = '';
function saveNotesDraft() {
  if (!currentChantier) return;
  const el = document.getElementById('notes-field');
  if (!el) return;
  currentChantier.notes = el.value;
  clearTimeout(notesTimer);
  notesTimer = setTimeout(() => {
    saveChantiers();
    const n = document.getElementById('notes-draft');
    if (n) {
      n.textContent = '✓ Brouillon enregistré';
      setTimeout(() => { if (n) n.textContent = ''; }, 1500);
    }
  }, 400);
}

function openGPS() {
  if (!currentChantier) return;
  window.open('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(currentChantier.adresse), '_blank');
}

async function supprimerChantier() {
  const ch = currentChantier;
  if (!ch || !confirm('Supprimer définitivement cette fiche ?')) return;
  chantiers = chantiers.filter(c => c.id !== ch.id);
  saveChantiers();
  enqueue({ type: 'delete', id: ch.id });
  currentChantier = null;
  render();
}

// ============================================================
// PHOTOS — interface
// ============================================================
//
// Une seule grille sert la fiche chantier et le formulaire de création :
// dans le second cas le chantier n'existe pas encore, les photos
// patientent dans photosNouveau et sont rattachées à la création.

let photosNouveau = [];
let devisNouveau = null;

function photosCourantes() {
  return currentChantier ? (currentChantier.photos = currentChantier.photos || []) : photosNouveau;
}

function grillePhotos(photos) {
  return '<div class="photo-grid">' +
    photos.map((p, i) =>
      '<div class="photo-cell" data-i="' + i + '" data-cle="' + esc(p.cle || '') + '" onclick="ouvrirViewer(' + i + ')">' +
        '<div class="photo-load">…</div>' +
        (p.path ? '' : '<div class="photo-flag">⏳</div>') +
      '</div>').join('') +
    '<div class="photo-cell photo-add" onclick="ajouterPhotos()">＋<span>PHOTO</span></div>' +
  '</div>';
}

// Les vignettes arrivent de façon asynchrone (cache local ou proxy) :
// la grille s'affiche tout de suite et se remplit ensuite.
// Chaque rendu obtient son propre numéro. Un téléchargement lancé pour
// une fiche et revenu après un changement d'écran doit être abandonné :
// sinon les vignettes du chantier précédent se posent dans les cases du
// suivant — des photos de propriété privée attribuées au mauvais client.
let rendPhotos = 0;
async function remplirPhotos() {
  const monTour = ++rendPhotos;
  const photos = photosCourantes();
  for (let i = 0; i < photos.length; i++) {
    if (monTour !== rendPhotos) return;
    const src = await photoSrc(photos[i]);
    if (monTour !== rendPhotos) return;
    // On vise la case par la clé de la photo, pas par sa position.
    const cell = document.querySelector('.photo-cell[data-i="' + i + '"]');
    if (!cell || cell.getAttribute('data-cle') !== (photos[i].cle || '')) return;
    const flag = cell.querySelector('.photo-flag');
    cell.innerHTML = src
      ? '<img src="' + src + '" alt="Photo chantier">'
      : '<div class="photo-load">Hors ligne</div>';
    if (flag) cell.appendChild(flag);
  }
}

async function ajouterPhotos() {
  const files = await choisirFichiers('image/*', true);
  if (!files.length) return;
  const cible = currentChantier;

  let echecs = 0;
  for (const f of files) {
    const dataUrl = await compresser(f);
    const cle = nouvelleCle('ph');

    // fichierSet renvoie null si le stockage local est indisponible.
    // Empiler la photo malgré tout la ferait disparaître à l'envoi, sans
    // que personne ne comprenne pourquoi.
    if (await fichierSet(cle, dataUrl) === null) { echecs++; continue; }

    const entree = { cle: cle, path: null, nom: f.name || 'photo.jpg' };
    if (cible) {
      cible.photos = cible.photos || [];
      cible.photos.push(entree);
      cible.nbPhotos = cible.photos.length;
      enqueue({ type: 'photo', id: cible.id, cle: cle, nom: entree.nom });
    } else {
      photosNouveau.push(entree);
      saveNouveauDraft();
    }
  }

  if (cible) saveChantiers();
  render();
  if (echecs) {
    alert(echecs + ' photo(s) n\'ont pas pu être enregistrées sur cet appareil.\n\n' +
          'Fermez les autres onglets de l\'application et réessayez.');
  }
}

async function ouvrirViewer(i) {
  const p = photosCourantes()[i];
  if (!p) return;
  const src = await photoSrc(p);
  const ov = document.createElement('div');
  ov.className = 'viewer'; ov.id = 'viewer';
  ov.innerHTML =
    '<div class="viewer-img">' +
      (src ? '<img src="' + src + '" alt="Photo chantier">'
           : '<div style="color:#888;font-size:14px">Photo pas encore téléchargée sur cet appareil</div>') +
    '</div>' +
    '<div class="viewer-bar">' +
      '<button style="background:#333;color:#fff" onclick="fermerViewer()">Fermer</button>' +
      '<button style="background:var(--rouge);color:#fff" onclick="supprimerPhoto(' + i + ')">Supprimer</button>' +
    '</div>';
  document.body.appendChild(ov);
}

function fermerViewer() {
  const el = document.getElementById('viewer');
  if (el) el.remove();
}

async function supprimerPhoto(i) {
  const photos = photosCourantes();
  const p = photos[i];
  if (!p || !confirm('Supprimer cette photo ?')) return;

  photos.splice(i, 1);
  if (p.cle) fichierDel(p.cle);
  if (currentChantier) {
    currentChantier.nbPhotos = photos.length;
    saveChantiers();
    // Le fichier est retiré du serveur une fois la file d'attente vidée.
    if (p.path) enqueue({ type: 'deletePhoto', id: currentChantier.id, path: p.path, cle: p.path });
  }
  fermerViewer();
  render();
}

// ============================================================
// DEVIS
// ============================================================

async function joindreDevis() {
  const files = await choisirFichiers('application/pdf,image/*', false);
  if (!files.length) return;
  const f = files[0];
  const dataUrl = await lireFichier(f);
  const cle = nouvelleCle('dv');
  await fichierSet(cle, dataUrl);

  if (currentChantier) {
    currentChantier.devis = f.name;
    currentChantier.devisCle = cle;
    saveChantiers();
    enqueue({ type: 'devis', id: currentChantier.id, cle: cle, nom: f.name });
  } else {
    devisNouveau = { cle: cle, nom: f.name };
    saveNouveauDraft();
  }
  render();
}

async function ouvrirDevis() {
  const ch = currentChantier;
  if (!ch) return;

  // Fenêtre ouverte de façon synchrone : après un await, Safari la
  // bloquerait comme une popup non sollicitée.
  const w = window.open('', '_blank');

  let dataUrl = ch.devisCle ? await fichierGet(ch.devisCle) : null;
  if (!dataUrl && ch.devisPath) {
    const ck = 'file-' + ch.devisPath;
    dataUrl = await fichierGet(ck);
    if (!dataUrl) {
      try {
        dataUrl = await telecharger(ch.devisPath);
        if (dataUrl) fichierSet(ck, dataUrl);
      } catch (e) {}
    }
  }

  if (!dataUrl) { if (w) w.close(); alert('Devis indisponible : pas de réseau et pas encore téléchargé.'); return; }
  const url = URL.createObjectURL(await (await fetch(dataUrl)).blob());
  if (w) w.location = url; else window.open(url, '_blank');
}

// ============================================================
// CLÔTURE
// ============================================================

function terminer() {
  const ch = currentChantier;
  if (!ch) return;

  const el = document.getElementById('notes-field');
  ch.notes = el ? el.value : (ch.notes || '');
  ch.statut = 'Terminé';
  ch.dateTermine = todayFr();

  // Enregistré localement et confirmé tout de suite : le réseau d'un
  // chantier ne doit pas faire attendre l'ouvrier devant le client.
  // L'envoi part en tâche de fond via la file d'attente.
  saveChantiers();
  syncChantier(ch);
  showModal('success');
}

function showModal() {
  const existing = document.getElementById('modal-overlay');
  if (existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay'; overlay.id = 'modal-overlay';
  const nbPhotos = (currentChantier && currentChantier.photos) ? currentChantier.photos.length : 0;

  overlay.innerHTML = '<div class="modal">' +
    '<div class="modal-handle"></div>' +
    '<div class="success-check">✅</div>' +
    '<div style="text-align:center;font-size:20px;font-weight:700;margin-bottom:8px;color:var(--noir)">Chantier terminé !</div>' +
    '<div style="text-align:center;font-size:14px;color:#666;margin-bottom:20px">Enregistré sur l\'appareil.</div>' +
    '<div style="background:var(--green-light);border-radius:10px;padding:14px;margin-bottom:20px;font-size:14px;color:var(--green);line-height:1.8">' +
      '✓ Statut mis à jour : Terminé<br>' +
      '✓ ' + nbPhotos + ' photo(s) enregistrée(s)<br>' +
      '✓ Notes sauvegardées<br>' +
      '<span id="sync-line">⏳ Envoi au serveur…</span>' +
    '</div>' +
    '<button class="btn btn-black" onclick="closeModal();currentChantier=null;render()">Retour à la liste</button>' +
  '</div>';

  // Fermer en tapant à côté doit ramener à la liste comme le bouton :
  // sinon la fiche réapparaît « À faire », et l'ouvrier revalide.
  overlay.addEventListener('click', e => {
    if (e.target === overlay) { closeModal(); currentChantier = null; render(); }
  });
  document.body.appendChild(overlay);
  suivreSync();
}

// La modale s'affiche immédiatement ; cette ligne se met à jour seule
// quand la file d'attente s'est vidée.
function suivreSync() {
  // Une opération refusée quitte la file elle aussi : sans ce repère,
  // la modale annoncerait « synchronisé » sur un envoi rejeté.
  const rejetsAvant = getRejets().length;
  const tick = setInterval(() => {
    const line = document.getElementById('sync-line');
    if (!line) { clearInterval(tick); return; }
    if (getRejets().length > rejetsAvant) {
      line.textContent = '⚠ Envoi refusé — voir ' + (estPatron() ? 'Dashboard' : 'Mon compte');
      clearInterval(tick);
    } else if (!getQueue().length) {
      line.textContent = '✓ Fiche synchronisée';
      clearInterval(tick);
    } else if (!navigator.onLine) {
      line.textContent = '📴 Hors ligne — envoi au retour du réseau';
    }
  }, 1000);
  setTimeout(() => clearInterval(tick), 120000);
}

function closeModal() { const el = document.getElementById('modal-overlay'); if (el) el.remove(); }

// ============================================================
// NOUVEAU CHANTIER
// ============================================================

const DRAFT_KEY = 'jardinator_draft_nouveau';
const DRAFT_FIELDS = ['n-client', 'n-adresse', 'n-date', 'n-statut', 'n-consignes'];

function renderNouveau(c) {
  const today = new Date().toISOString().split('T')[0];
  let d = {};
  try { d = JSON.parse(localStorage.getItem(DRAFT_KEY) || '{}'); } catch (e) {}
  if (Array.isArray(d.__photos)) photosNouveau = d.__photos;
  if (d.__devis) devisNouveau = d.__devis;
  const enCours = d['n-statut'] === 'En cours';

  c.innerHTML =
    '<div style="font-size:20px;font-weight:700;color:var(--noir);margin-bottom:18px">Nouveau chantier</div>' +
    (DRAFT_FIELDS.some(k => d[k]) || photosNouveau.length || devisNouveau
      ? '<div class="alert-info">📝 Brouillon repris automatiquement.</div>' : '') +
    '<div class="field-group"><div class="field-label">Nom du client *</div>' +
      '<input class="field-input" id="n-client" placeholder="Ex : Jean Martin" autocomplete="name" value="' + esc(d['n-client'] || '') + '"></div>' +
    '<div class="field-group"><div class="field-label">Adresse d\'intervention *</div>' +
      '<input class="field-input" id="n-adresse" placeholder="Ex : 12 Rue des Érables, 69003 Lyon" autocomplete="street-address" value="' + esc(d['n-adresse'] || '') + '"></div>' +
    '<div class="field-group"><div class="field-label">Date prévue</div>' +
      '<input class="field-input" type="date" id="n-date" value="' + esc(d['n-date'] || today) + '"></div>' +
    '<div class="field-group"><div class="field-label">👷 Assigner à</div>' +
      casesOuvriers(assignesNouveau, 'basculerAssignationNouveau') + '</div>' +
    '<div class="field-group"><div class="field-label">Statut</div>' +
      '<select class="field-input" id="n-statut">' +
        '<option' + (enCours ? '' : ' selected') + '>À faire</option>' +
        '<option' + (enCours ? ' selected' : '') + '>En cours</option>' +
      '</select></div>' +
    '<div class="field-group"><div class="field-label">Consignes d\'intervention</div>' +
      '<textarea class="field-input" id="n-consignes" placeholder="Ex : Abattage + broyage. Accès portail code 2204.">' + esc(d['n-consignes'] || '') + '</textarea>' +
      '<div class="draft-note" id="nouveau-draft"></div></div>' +
    '<div class="field-group"><div class="field-label">📄 Devis</div>' +
      (devisNouveau
        ? '<div class="file-chip"><span style="font-size:20px">📄</span>' +
          '<span class="file-chip-name">' + esc(devisNouveau.nom) + '</span>' +
          '<span class="file-chip-x" onclick="devisNouveau=null;saveNouveauDraft();render()">×</span></div>'
        : '<button class="gps-btn" onclick="joindreDevis()">📎 Joindre le devis (PDF)</button>') +
    '</div>' +
    '<div class="field-group"><div class="field-label">📷 Photos (' + photosNouveau.length + ')</div>' +
      grillePhotos(photosNouveau) + '</div>' +
    '<button class="btn btn-red" onclick="creerChantier()">➕ Créer le chantier</button>' +
    '<button class="btn btn-gray" onclick="annulerNouveau()">Annuler</button>';

  DRAFT_FIELDS.forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.addEventListener('input', saveNouveauDraft); el.addEventListener('change', saveNouveauDraft); }
  });
}

let nouveauTimer = null;
function saveNouveauDraft() {
  const d = {};
  DRAFT_FIELDS.forEach(id => {
    const el = document.getElementById(id);
    if (el && el.value) d[id] = el.value;
  });
  // Les octets sont déjà en base locale sous ces clés ; il suffit de
  // retenir les clés. Ouvrir l'appareil photo fait très souvent
  // recharger la page sur iPhone : sans ça, on retrouvait le texte mais
  // plus aucune photo, et les blobs restaient orphelins.
  d.__photos = photosNouveau;
  d.__devis = devisNouveau;
  localStorage.setItem(DRAFT_KEY, JSON.stringify(d));
  clearTimeout(nouveauTimer);
  nouveauTimer = setTimeout(() => {
    const n = document.getElementById('nouveau-draft');
    if (n) { n.textContent = '✓ Brouillon enregistré'; setTimeout(() => { if (n) n.textContent = ''; }, 1500); }
  }, 400);
}

function clearNouveauDraft() { localStorage.removeItem(DRAFT_KEY); }

function annulerNouveau() {
  const enCours = localStorage.getItem(DRAFT_KEY) || photosNouveau.length || devisNouveau;
  if (enCours && !confirm('Abandonner la saisie en cours ?')) return;
  clearNouveauDraft();
  // Les blobs abandonnés doivent partir, sinon ils encombrent le stockage
  // de l'appareil sans qu'aucune fiche n'y renvoie.
  photosNouveau.forEach(p => fichierDel(p.cle));
  if (devisNouveau) fichierDel(devisNouveau.cle);
  photosNouveau = [];
  devisNouveau = null;
  assignesNouveau = [];
  switchTab('chantiers');
}

function creerChantier() {
  const client = document.getElementById('n-client').value.trim();
  const adresse = document.getElementById('n-adresse').value.trim();
  if (!client || !adresse) { alert('Merci de renseigner le nom du client et l\'adresse.'); return; }

  const nouveau = {
    id: 'CH-' + Date.now(),
    statut: document.getElementById('n-statut').value,
    client: client,
    adresse: adresse,
    devis: devisNouveau ? devisNouveau.nom : '—',
    devisCle: devisNouveau ? devisNouveau.cle : null,
    consignes: document.getElementById('n-consignes').value,
    notes: '',
    assignes: assignesNouveau.slice(),
    photos: photosNouveau.slice(),
    nbPhotos: photosNouveau.length,
    date: document.getElementById('n-date').value,
    dateTermine: '', devisPath: null
  };

  chantiers.unshift(nouveau);
  saveChantiers();
  clearNouveauDraft();

  // La ligne doit exister côté serveur avant que photos et devis puissent
  // s'y rattacher : la file est FIFO, donc « save » d'abord.
  creerDistant(nouveau);
  if (devisNouveau) enqueue({ type: 'devis', id: nouveau.id, cle: devisNouveau.cle, nom: devisNouveau.nom });
  photosNouveau.forEach(p => enqueue({ type: 'photo', id: nouveau.id, cle: p.cle, nom: p.nom }));

  photosNouveau = [];
  devisNouveau = null;
  assignesNouveau = [];
  switchTab('chantiers');
}

// ============================================================
// DASHBOARD
// ============================================================

function renderStats(c) {
  const total = chantiers.length;
  const todo = chantiers.filter(x => x.statut === 'À faire').length;
  const inprog = chantiers.filter(x => x.statut === 'En cours').length;
  const done = chantiers.filter(x => x.statut === 'Terminé').length;
  const pct = total ? Math.round(done / total * 100) : 0;
  const enAttente = getQueue().length;

  c.innerHTML =
    '<div style="font-size:20px;font-weight:700;color:var(--noir);margin-bottom:16px">Tableau de bord</div>' +
    '<div class="stat-row">' +
      '<div class="stat-card"><div class="stat-num" style="color:var(--amber)">' + todo + '</div><div class="stat-lbl">À faire</div></div>' +
      '<div class="stat-card"><div class="stat-num" style="color:var(--blue)">' + inprog + '</div><div class="stat-lbl">En cours</div></div>' +
      '<div class="stat-card"><div class="stat-num" style="color:var(--green)">' + done + '</div><div class="stat-lbl">Terminés</div></div>' +
    '</div>' +
    '<div class="stat-card" style="margin-bottom:14px;display:flex;align-items:center;gap:14px">' +
      '<div style="font-size:32px">📊</div>' +
      '<div><div style="font-weight:700;font-size:16px;color:var(--noir)">' + total + ' chantiers au total</div>' +
      '<div style="font-size:13px;color:#888;margin-top:3px">' + pct + '% de taux de complétion</div></div>' +
    '</div>' +
    '<div class="divider"></div>' +
    '<div class="section-title">Synchronisation</div>' +
    (!CONFIGURED
      ? '<div class="alert-warning">⚠ URL Supabase non renseignée dans le code.</div>'
      : enAttente
        ? '<div class="alert-warning">⏳ ' + enAttente + ' modification(s) en attente d\'envoi.</div>'
        : '<div class="alert-success"><span class="sync-indicator"></span>Connecté — synchronisation active</div>') +
    (getRejets().length
      ? '<div class="divider"></div>' +
        '<div class="section-title">Modifications refusées</div>' +
        '<div class="alert-warning">Ces modifications n\'ont pas pu être enregistrées sur le serveur. ' +
        'Elles restent visibles sur cet appareil mais ne sont pas partagées.</div>' +
        getRejets().slice().reverse().map(r =>
          '<div class="file-chip" style="align-items:flex-start">' +
            '<span style="font-size:18px">⚠</span>' +
            '<div style="flex:1;min-width:0">' +
              '<div style="font-size:14px;color:var(--noir)">' + esc(r.quoi) + '</div>' +
              '<div style="font-size:12px;color:#888;margin-top:2px">' + esc(r.pourquoi) + '</div>' +
              '<div style="font-size:11px;color:#bbb;margin-top:2px">' + esc(r.quand) + '</div>' +
            '</div></div>').join('') +
        '<button class="btn btn-gray" onclick="viderRejets()">Effacer cette liste</button>'
      : '') +
    '<div class="divider"></div>' +
    '<div class="section-title">Alertes</div>' +
    (!('Notification' in window)
      ? '<div class="alert-warning">Ce navigateur ne gère pas les alertes.</div>'
      : alertesActives()
        ? '<div class="alert-success">🔔 Alertes activées — vous serez prévenu des nouveaux chantiers quand l\'app est ouverte.</div>'
        : '<div style="font-size:13px;color:#666;margin-bottom:10px">Recevoir une alerte à l\'arrivée d\'un nouveau chantier.</div>' +
          '<button class="btn btn-gray" onclick="demanderAlertes()">🔔 Activer les alertes</button>') +
    '<div class="divider"></div>' +
    '<div class="section-title">Compte</div>' +
    '<div class="file-chip"><span style="font-size:20px">👤</span>' +
      '<span class="file-chip-name">' + esc((session && session.user && session.user.email) || '—') + '</span></div>' +
    '<button class="btn btn-gray" onclick="seDeconnecter()">Se déconnecter</button>' +
    '<div class="divider"></div>' +
    '<div class="section-title">Données locales</div>' +
    '<div style="font-size:13px;color:#666;margin-bottom:12px">Les fiches sont conservées sur cet appareil pour fonctionner hors réseau, puis envoyées au serveur dès que le réseau revient.</div>' +
    '<button class="btn btn-outline-red" onclick="reinitialiser()">🗑 Réinitialiser les données locales</button>';
}

function reinitialiser() {
  if (getQueue().length && !confirm('Des modifications ne sont pas encore envoyées. Elles seront perdues. Continuer ?')) return;
  if (!confirm('Supprimer toutes les données locales ?')) return;
  localStorage.clear();
  location.reload();
}

// ============================================================
// ACCÈS
// ============================================================

function demarrer() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  appliquerRole();
  chantiers = loadLocal();   // affichage immédiat, sans attendre le réseau
  render();
  updateQueueBanner();
  flushQueue();
  tempsReel();
  chargerEquipe().then(() => loadFromSheets(true));
}

async function connexion() {
  const mail = document.getElementById('mail-input').value.trim();
  const mdp  = document.getElementById('pwd-input').value;
  const err  = document.getElementById('pwd-error');
  const btn  = document.getElementById('btn-login');

  if (!mail || !mdp) { err.textContent = 'Renseignez votre e-mail et votre mot de passe.'; err.style.display = 'block'; return; }
  if (!CONFIGURED)   { err.textContent = 'Application non configurée (URL Supabase manquante).'; err.style.display = 'block'; return; }

  err.style.display = 'none';
  btn.textContent = 'Connexion…'; btn.disabled = true;
  try {
    await seConnecter(mail, mdp);
    demarrer();
  } catch (e) {
    err.textContent = /Invalid login/i.test(e.message)
      ? 'E-mail ou mot de passe incorrect.'
      : 'Connexion impossible : ' + e.message;
    err.style.display = 'block';
    document.getElementById('pwd-input').value = '';
  }
  btn.textContent = 'Se connecter'; btn.disabled = false;
}

// Session déjà ouverte : on entre directement. Le jeton sera renouvelé
// au premier appel s'il a expiré.
if (session && session.access_token) demarrer();

// Dernier filet : au passage en arrière-plan (appel, veille, changement
// d'app), on force la persistance de ce qui est à l'écran.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { saveNotesDraft(); saveChantiers(); }
  else {
    flushQueue();
    // Le WebSocket est souvent coupé pendant la mise en veille :
    // on le relance et on resynchronise à la reprise.
    tempsReel();
    if (!isEditing()) loadFromSheets(true);
  }
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
